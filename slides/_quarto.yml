project:
  type: website
  output-dir: ../build/slides
  render:
    - "*.qmd"

website:
  title: "Zie Scherp Scherper"
  # Zelfde balk als in het hoofdboek, zie de opmerking in ../_quarto.yml. Ze komt
  # enkel op overzicht.qmd: dat is de enige html-pagina hier, de decks zelf zijn
  # revealjs en hebben geen navbar.
  announcement:
    position: below-navbar
    dismissable: false
    type: warning
    content: |
      **Werk in opbouw.** Deze cursus wordt op dit moment volop herwerkt.
      Hoofdstukken kunnen nog onaf zijn of morgen anders staan.
  navbar:
    logo-href: ../index.html
    background: light
    pinned: true
    left:
      - text: "Handboek"
        href: ../index.html
      - text: "Handboek in pdf<br><small class='nav-pdf-datum'>versie {{< var pdfdatum >}}</small>"
        href: ../Zie-Scherp-Scherper.pdf
      - text: "Slides"
        href: overzicht.qmd
      - text: "Oefeningen"
        href: ../oefeningen/overzicht.html

format:
  revealjs:
    theme: [default, _extensions/grantmcdermott/clean/clean.scss, slides.scss]
    lang: nl
    slide-number: true
    transition: slide
